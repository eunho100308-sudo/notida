<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Toy Decompiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 영역 -->
        <header>
            <div class="header-left">
                <h1>🔍 Web Toy Decompiler</h1>
                <p>가상의 어셈블리 코드를 분석하여 고수준 C 스타일 코드로 디컴파일합니다.</p>
            </div>
            <div class="header-right">
                <!-- 흑백 모드 토글 버튼 -->
                <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="흑백/컬러 모드 전환">
                    <span id="themeIcon" class="theme-icon">🌓</span>
                    <span id="themeText">흑백 모드</span>
                </button>
            </div>
        </header>

        <!-- 메인 워크스페이스 -->
        <main class="workspace">
            <!-- 1. 입력 패널 -->
            <section class="panel input-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-badge">1</span>
                        <h2>Input (Assembly / Bytecode)</h2>
                    </div>
                    <div class="panel-actions">
                        <!-- 파일 업로드 버튼 및 숨김 input -->
                        <label for="fileUploadInput" class="btn btn-secondary upload-label" title="파일 업로드 (.asm, .txt 등)">
                            📁 파일 업로드
                        </label>
                        <input type="file" id="fileUploadInput" accept=".asm,.s,.txt,.bin,text/*" style="display: none;">
                        <button id="resetExampleBtn" class="btn btn-ghost" type="button" title="기본 예제 불러오기">예제</button>
                        <button id="clearInputBtn" class="btn btn-ghost" type="button" title="입력창 지우기">지우기</button>
                    </div>
                </div>

                <!-- 파일 정보 표시 바 (파일 업로드 시 활성화) -->
                <div id="fileInfoBar" class="file-info-bar" style="display: none;">
                    <div class="file-details">
                        <span class="file-icon">📄</span>
                        <span id="fileNameDisplay" class="file-name">sample.asm</span>
                        <span id="fileSizeDisplay" class="file-size">(0 KB)</span>
                    </div>
                    <button id="removeFileBtn" class="btn-icon-close" type="button" title="파일 닫기">&times;</button>
                </div>

                <!-- 텍스트 영역 및 드래그 앤 드롭 구역 -->
                <div class="editor-container" id="editorContainer">
                    <textarea id="assemblyInput" spellcheck="false" placeholder="여기에 어셈블리 코드를 입력하거나 파일을 드래그하여 놓으세요... (예: MOV R1, 10)">MOV R1, 10
MOV R2, 20
ADD R1, R2
CMP R1, 30
JEQ 8
PRINT "Not Equal"
JMP 10
PRINT "Equal!"
RET</textarea>
                    <!-- 드래그 오버레이 안내창 -->
                    <div id="dropOverlay" class="drop-overlay">
                        <div class="drop-box">
                            <span class="drop-icon">📥</span>
                            <p>파일을 여기에 놓으면 자동으로 불러옵니다</p>
                        </div>
                    </div>
                </div>

                <div class="panel-footer">
                    <span id="lineCounter" class="info-text">9 줄</span>
                    <button id="decompileBtn" class="btn btn-primary" type="button">
                        ⚡ 디컴파일 실행 (Decompile)
                    </button>
                </div>
            </section>

            <!-- 2. 출력 패널 -->
            <section class="panel output-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-badge">2</span>
                        <h2>Output (Decompiled High-Level Code)</h2>
                    </div>
                    <div class="panel-actions">
                        <button id="copyCodeBtn" class="btn btn-secondary" type="button" title="코드 클립보드 복사">
                            📋 복사
                        </button>
                        <button id="downloadCodeBtn" class="btn btn-secondary" type="button" title="C 파일로 다운로드">
                            💾 .c 저장
                        </button>
                    </div>
                </div>

                <div class="output-container">
                    <pre id="outputCode"><code>디컴파일 결과가 여기에 표시됩니다.
왼쪽 패널의 [디컴파일 실행] 버튼을 눌러보세요.</code></pre>
                </div>

                <div class="panel-footer">
                    <span id="statusMessage" class="info-text">상태: 대기 중</span>
                </div>
            </section>
        </main>
    </div>

    <!-- 알림 토스트 팝업 -->
    <div id="toastNotification" class="toast"></div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
